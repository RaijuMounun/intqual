[package]
name = "intqual-core"
version = "1.3.0"
edition = "2024"
authors = ["Eren Keskinoğlu <erenkeskinoglu@outlook.com>"]
description = "Core engine for intqual"
license = "MIT"
repository = "https://github.com/RaijuMounun/intqual"

[dependencies]
tokio = { workspace = true }
socket2 = { workspace = true }
dns-lookup = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }

[features]
# JSON Schema derives on the report types, for the MCP server.
schema = ["dep:schemars"]
